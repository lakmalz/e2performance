<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;">
        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <meta name="color-scheme" content="light dark">
        <link rel="stylesheet" href="css/index.css">
        <title>Dashboard</title>
    </head>
    <body>
        <!-- Dashboard Section -->
        <div id="dashboard" class="page">
            <h1>Dashboard</h1>
            <div class="button-container">
                <button class="settings-btn" id="settingsBtn">Settings</button>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </div>

        <!-- Settings Section -->
        <div id="settings" class="page" style="display: none;">
            <h1>Settings</h1>
            <div class="settings-content">
                <div class="setting-item">
                    <span class="setting-label">App Version</span>
                    <span class="setting-value">1.0.0</span>
                </div>
                <div class="setting-item">
                    <span class="setting-label">Language</span>
                    <span class="setting-value">English</span>
                </div>
                <div class="setting-item">
                    <span class="setting-label">Notifications</span>
                    <span class="setting-value">Enabled</span>
                </div>
                <div class="setting-item">
                    <span class="setting-label">Theme</span>
                    <span class="setting-value">Light Mode</span>
                </div>
                <div class="setting-item">
                    <span class="setting-label">Data Sync</span>
                    <span class="setting-value">Auto Sync</span>
                </div>
            </div>
        </div>

        <script src="cordova.js"></script>
        <script src="js/index.js"></script>
    </body>
</html>
