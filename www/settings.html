        <meta charset="utf-8">

        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">

        <meta name="color-scheme" content="light dark">
        <link rel="stylesheet" href="css/settings.css">
        <title>Settings</title>
    </head>
    <body>
        <div class="settings-container">
            <div class="settings-header">
                <h1>Settings</h1>
                <p class="back-hint">Press back button to return to dashboard</p>
            </div>
            
            <div class="settings-content">
                <div class="setting-item">
                    <label class="setting-label">App Version</label>
                    <span class="setting-value">1.0.0</span>
                </div>
                
                <div class="setting-item">
                    <label class="setting-label">Language</label>
                    <span class="setting-value">English</span>
                </div>
                
                <div class="setting-item">
                    <label class="setting-label">Notifications</label>
                    <span class="setting-value">Enabled</span>
                </div>
                
                <div class="setting-item">
                    <label class="setting-label">Theme</label>
                    <span class="setting-value">Light Mode</span>
                </div>
                
                <div class="setting-item">
                    <label class="setting-label">Data Sync</label>
                    <span class="setting-value">Auto Sync</span>
                </div>
            </div>
        </div>
        
        <script src="cordova.js"></script>
    </body>
